<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Green &amp; Blue Spaces Map — Field Notes</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{
  --ink:#161d24;
  --ink-soft:#232d38;
  --moss:#42604a;
  --lichen:#9ab596;
  --bone:#eae3d2;
  --amber:#e2a13d;
  --dusk:#6c5a95;
  --blue:#5b9bd5;
  --line:rgba(234,227,210,0.14);
}
*{box-sizing:border-box;}
html,body{ margin:0; padding:0; height:100%; background:var(--ink); font-family:'Inter',-apple-system,sans-serif; }

.topbar{
  position:absolute; top:0; left:0; right:0; z-index:1000;
  background:linear-gradient(to bottom, rgba(22,29,36,0.95), rgba(22,29,36,0));
  padding:0.8rem 0.9rem 1.6rem;
  display:flex; align-items:center; justify-content:space-between; gap:0.6rem;
  pointer-events:none;
}
.topbar > *{ pointer-events:auto; }
.back-link{
  color:var(--bone);
  text-decoration:none;
  font-size:0.85rem;
  background:rgba(22,29,36,0.85);
  border:1px solid var(--line);
  padding:0.5rem 0.8rem;
  border-radius:8px;
  white-space:nowrap;
}
.status-pill{
  color:var(--bone);
  font-family:'Space Mono',monospace;
  font-size:0.68rem;
  background:rgba(22,29,36,0.85);
  border:1px solid var(--line);
  padding:0.45rem 0.7rem;
  border-radius:8px;
  max-width:60vw;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

#map{ position:absolute; top:0; left:0; right:0; bottom:0; }

.panel{
  position:absolute; z-index:1000;
  background:rgba(22,29,36,0.92);
  border:1px solid var(--line);
  border-radius:10px;
  padding:0.6rem 0.7rem;
  color:var(--bone);
  font-size:0.75rem;
}
.layer-panel{ bottom:0.9rem; left:0.9rem; }
.layer-panel label{ display:flex; align-items:center; gap:0.5rem; margin:0.3rem 0; cursor:pointer; }
.layer-panel input{ accent-color:var(--moss); }
.legend{ bottom:0.9rem; right:0.9rem; }
.legend div{ display:flex; align-items:center; gap:0.4rem; margin:0.2rem 0; }
.legend .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.legend .sw{ width:12px; height:9px; flex-shrink:0; }

.zoom-hint{
  position:absolute; bottom:0.9rem; left:50%; transform:translateX(-50%);
  z-index:1000;
  background:rgba(22,29,36,0.92);
  border:1px solid var(--line);
  border-radius:10px;
  padding:0.6rem 0.9rem;
  color:var(--bone);
  font-size:0.78rem;
  display:none;
  white-space:nowrap;
}
.zoom-hint.visible{ display:block; }

.leaflet-popup-content-wrapper{ background:var(--ink-soft); color:var(--bone); border-radius:10px; }
.leaflet-popup-tip{ background:var(--ink-soft); }
.space-popup .name{ font-family:'Fraunces',serif; font-size:1.05rem; margin:0 0 0.2rem; }
.space-popup .row{ font-size:0.78rem; opacity:0.85; margin:0.15rem 0; }
.space-popup a{ color:var(--lichen); }

.user-dot{
  width:16px; height:16px;
  background:#4d9de0;
  border:2px solid white;
  border-radius:50%;
  box-shadow:0 0 0 4px rgba(77,157,224,0.3);
}
</style>
</head>
<body>

<div class="topbar">
  <a href="nature-dashboard.html" class="back-link">← Dashboard</a>
  <div class="status-pill" id="statusPill">Loading map…</div>
</div>

<div id="map"></div>

<div class="zoom-hint" id="zoomHint">Zoom in further to load green &amp; blue spaces</div>

<div class="panel layer-panel">
  <label><input type="checkbox" id="toggleGreenBlue" checked> Green &amp; blue spaces</label>
  <label><input type="checkbox" id="toggleSightings"> iNaturalist sightings (30 days)</label>
</div>

<div class="panel legend">
  <div><span class="sw" style="background:rgba(66,96,74,0.55); border:1px solid #42604a;"></span>Green space</div>
  <div><span class="sw" style="background:rgba(91,155,213,0.45); border:1px solid #5b9bd5;"></span>Blue space</div>
  <div><span class="dot" style="background:#6c5a95;"></span>Sighting</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const OVERPASS_MIRRORS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.openstreetmap.fr/api/interpreter',
  'https://overpass.openstreetmap.ru/api/interpreter'
];

async function fetchOverpass(query){
  let lastError = null;
  for(const mirror of OVERPASS_MIRRORS){
    try{
      const r = await fetch(mirror, { method: 'POST', body: query });
      if(!r.ok) throw new Error('http ' + r.status);
      return await r.json();
    }catch(e){
      lastError = e;
      console.warn('Overpass mirror failed, trying next:', mirror, e.message);
    }
  }
  throw lastError || new Error('all Overpass mirrors failed');
}

// Below this zoom the bounding box covers too much ground for a single
// Overpass query to return quickly (or at all) -- same reasoning as the
// dashboard's around:2000/3000m radius queries, just expressed as a zoom
// floor instead of a fixed radius since this page has no fixed center point.
const MIN_ZOOM_GREENBLUE = 13;
const MIN_ZOOM_SIGHTINGS = 13;

const map = L.map('map', { zoomControl: false }).setView([51.45, -0.09], 12);
L.control.zoom({ position: 'bottomleft' }).addTo(map);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

const greenBlueLayer = L.layerGroup().addTo(map);
const sightingsLayer = L.layerGroup();

const statusEl = document.getElementById('statusPill');
const zoomHintEl = document.getElementById('zoomHint');

function padBounds(bounds, factor){
  // Fetch a bbox padded well beyond the current view so small pans reuse
  // the same data instead of re-querying Overpass/iNaturalist on every
  // drag -- refetch only happens once you pan/zoom out of the padded area.
  return bounds.pad(factor);
}

function bboxOf(bounds){
  return [bounds.getSouth(), bounds.getWest(), bounds.getNorth(), bounds.getEast()];
}

function boundsContain(outer, inner){
  return outer && outer.contains(inner);
}

// --- Green & blue spaces ---
let lastGreenBlueBounds = null;
let greenBlueInFlight = false;

function styleForTags(tags){
  const isBlue = tags.natural === 'water' || tags.natural === 'coastline' ||
    tags.waterway || tags.leisure === 'swimming_area';
  if(isBlue) return { color:'#5b9bd5', fillColor:'#5b9bd5', weight:2, fillOpacity:0.35, kind: tags.waterway || tags.natural || 'water' };
  return { color:'#42604a', fillColor:'#42604a', weight:2, fillOpacity:0.35, kind: tags.leisure || tags.natural || 'green space' };
}

function popupHtml(name, kind){
  return `<div class="space-popup"><div class="name">${name}</div><div class="row">${kind}</div></div>`;
}

async function fetchGreenBlue(){
  if(greenBlueInFlight) return;
  const zoom = map.getZoom();
  if(zoom < MIN_ZOOM_GREENBLUE){
    zoomHintEl.classList.add('visible');
    return;
  }
  zoomHintEl.classList.remove('visible');
  const viewBounds = map.getBounds();
  if(boundsContain(lastGreenBlueBounds, viewBounds)) return;

  greenBlueInFlight = true;
  statusEl.textContent = 'Loading green & blue spaces…';
  const fetchBounds = padBounds(viewBounds, 1.0); // fetch 3x the visible area
  const [s, w, n, e] = bboxOf(fetchBounds);
  const q = `[out:json][timeout:25];(
    way["leisure"~"park|nature_reserve|garden"](${s},${w},${n},${e});
    way["natural"~"wood|water|heath|wetland"](${s},${w},${n},${e});
    node["leisure"~"park|nature_reserve"](${s},${w},${n},${e});
    way["natural"="coastline"](${s},${w},${n},${e});
    way["waterway"~"river|canal|stream"](${s},${w},${n},${e});
    way["leisure"="swimming_area"](${s},${w},${n},${e});
  );out geom;`;

  try{
    const d = await fetchOverpass(q);
    lastGreenBlueBounds = fetchBounds;
    greenBlueLayer.clearLayers();
    let count = 0;
    for(const el of (d.elements || [])){
      const tags = el.tags || {};
      const name = tags.name || 'Unnamed';
      const style = styleForTags(tags);
      let layer = null;
      if(el.type === 'node' && el.lat != null){
        layer = L.circleMarker([el.lat, el.lon], { radius:7, color:style.color, fillColor:style.fillColor, weight:2, fillOpacity:style.fillOpacity });
      } else if(el.geometry && el.geometry.length > 1){
        const latlngs = el.geometry.map(pt => [pt.lat, pt.lon]);
        const isLine = tags.waterway || tags.natural === 'coastline';
        layer = isLine
          ? L.polyline(latlngs, { color: style.color, weight: 3 })
          : L.polygon(latlngs, { color: style.color, fillColor: style.fillColor, weight: 2, fillOpacity: style.fillOpacity });
      }
      if(layer){
        layer.bindPopup(popupHtml(name, style.kind));
        greenBlueLayer.addLayer(layer);
        count++;
      }
    }
    statusEl.textContent = `${count.toLocaleString()} green & blue features`;
  }catch(e){
    console.error('green/blue fetch failed', e);
    statusEl.textContent = 'Could not load green & blue spaces';
  }finally{
    greenBlueInFlight = false;
  }
}

// --- iNaturalist sightings ---
let lastSightingsBounds = null;
let sightingsInFlight = false;
let sightingsEnabled = false;

function daysAgoIso(days){
  const d = new Date(Date.now() - days*86400000);
  return d.toISOString().slice(0,10);
}

async function fetchSightings(){
  if(!sightingsEnabled || sightingsInFlight) return;
  const zoom = map.getZoom();
  if(zoom < MIN_ZOOM_SIGHTINGS){
    zoomHintEl.classList.add('visible');
    return;
  }
  const viewBounds = map.getBounds();
  if(boundsContain(lastSightingsBounds, viewBounds)) return;

  sightingsInFlight = true;
  statusEl.textContent = 'Loading recent sightings…';
  const fetchBounds = padBounds(viewBounds, 0.5); // smaller pad -- sightings queries are heavier per-area than Overpass
  const url = `https://api.inaturalist.org/v1/observations?swlat=${fetchBounds.getSouth()}&swlng=${fetchBounds.getWest()}&nelat=${fetchBounds.getNorth()}&nelng=${fetchBounds.getEast()}&d1=${daysAgoIso(30)}&verifiable=true&per_page=200&order_by=observed_on&order=desc`;

  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error('inaturalist http ' + r.status);
    const d = await r.json();
    lastSightingsBounds = fetchBounds;
    sightingsLayer.clearLayers();
    for(const o of (d.results || [])){
      if(!o.geojson || !o.geojson.coordinates || !o.taxon) continue;
      const [lon, lat] = o.geojson.coordinates;
      const name = o.taxon.preferred_common_name || o.taxon.name;
      const marker = L.circleMarker([lat, lon], { radius:6, color:'#6c5a95', fillColor:'#6c5a95', weight:1, fillOpacity:0.8 });
      const obsUrl = o.uri || `https://www.inaturalist.org/observations/${o.id}`;
      marker.bindPopup(`<div class="space-popup">
        <div class="name">${name}</div>
        <div class="row">${o.taxon.name}${o.observed_on ? ' · ' + o.observed_on : ''}</div>
        <div class="row"><a href="${obsUrl}" target="_blank" rel="noopener">View on iNaturalist</a></div>
      </div>`);
      sightingsLayer.addLayer(marker);
    }
    statusEl.textContent = `${(d.results || []).length} sightings in the last 30 days`;
  }catch(e){
    console.error('sightings fetch failed', e);
    statusEl.textContent = 'Could not load sightings';
  }finally{
    sightingsInFlight = false;
  }
}

function refreshAll(){
  fetchGreenBlue();
  fetchSightings();
}

map.on('moveend', refreshAll);

document.getElementById('toggleGreenBlue').addEventListener('change', e => {
  if(e.target.checked){ map.addLayer(greenBlueLayer); fetchGreenBlue(); }
  else{ map.removeLayer(greenBlueLayer); }
});

document.getElementById('toggleSightings').addEventListener('change', e => {
  sightingsEnabled = e.target.checked;
  if(sightingsEnabled){ map.addLayer(sightingsLayer); fetchSightings(); }
  else{ map.removeLayer(sightingsLayer); }
});

let userMarker = null;
function initUserLocation(){
  if(!navigator.geolocation) return;
  navigator.geolocation.watchPosition(
    pos => {
      const latlng = [pos.coords.latitude, pos.coords.longitude];
      if(!userMarker){
        userMarker = L.marker(latlng, {
          icon: L.divIcon({ className:'', html:'<div class="user-dot"></div>', iconSize:[16,16], iconAnchor:[8,8] }),
          zIndexOffset: 1000
        }).addTo(map);
        if(!centeredFromUrl) map.setView(latlng, 15);
      } else {
        userMarker.setLatLng(latlng);
      }
    },
    err => console.error('geolocation failed on spaces map', err),
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
  );
}

const params = new URLSearchParams(window.location.search);
const qLat = parseFloat(params.get('lat'));
const qLng = parseFloat(params.get('lng'));
const centeredFromUrl = !isNaN(qLat) && !isNaN(qLng);
if(centeredFromUrl){
  map.setView([qLat, qLng], 15);
}

initUserLocation();

// Leaflet measures its container's pixel size at init time -- if the tab
// isn't actually visible/composited yet at that moment (backgrounded tab,
// PWA restored from background, etc.) it can cache a 0x0 size, which makes
// every getBounds() call after it return a degenerate box and silently
// breaks every bbox-based fetch on this page. invalidateSize() forces a
// fresh measurement; calling it once on ready and again on visibility
// changes covers both the initial-load case and returning to a
// backgrounded tab later.
map.whenReady(() => { map.invalidateSize(); refreshAll(); });
document.addEventListener('visibilitychange', () => {
  if(!document.hidden) map.invalidateSize();
});
</script>
</body>
</html>
